<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="HafaClip (حافة), formerly Edge Clipboard — a clipboard manager that lives on the edge of your screen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14161f"/>
      <stop offset="1" stop-color="#1e1b33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#b07cff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect x="0" y="80" width="8" height="140" rx="4" fill="url(#accent)"/>
  <g transform="translate(90 70) scale(0.625)">
    <rect width="256" height="256" rx="56" fill="#0F766E"/>
    <rect x="44" y="56" width="28" height="144" rx="14" fill="#fff"/>
    <rect x="92" y="68" width="120" height="120" rx="22" fill="#fff"/>
    <rect x="114" y="100" width="76" height="14" rx="7" fill="#0F766E"/>
    <rect x="114" y="126" width="52" height="14" rx="7" fill="#0F766E"/>
  </g>
  <text x="300" y="140" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="64" font-weight="700" fill="#eceef4">HafaClip</text>
  <text x="618" y="138" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="46" font-weight="700" fill="#b07cff">حافة</text>
  <text x="740" y="136" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" fill="#7d8295">(Edge Clipboard)</text>
  <text x="302" y="192" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="26" fill="#a3a8bd">Your clipboard history, one hover away on the edge of the screen</text>
  <text x="302" y="236" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" fill="#7c8cff">Windows · Free &amp; open source · by Ali Alhumedi</text>
</svg>
